name: Refresh WoW PvP data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      WOWPVP_CPU_TARGET: "0.90"
      WOWPVP_MAX_WORKERS_CAP: "8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh database
        run: python main.py --force --reset-data --skip-icons --skip-csv --enrich-wow-profile --incremental-enrichment --force-enrichment --enrichment-workers 8 --enrichment-request-delay 0.05 --enrichment-request-jitter 0.05 --enrichment-retry-attempts 8 --enrichment-retry-delay 10 --enrichment-retry-max-delay 120
